<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#168f93">
<title>TEguíA 0.4</title>
<style>
:root{--teal:#168f93;--teal2:#0f777b;--ink:#17212b;--muted:#66727d;--line:#e5e9ec;--soft:#f5f7f8;--green:#4f9b65}
*{box-sizing:border-box}body{margin:0;background:#eef1f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}
main{padding:20px 20px 30px;flex:1;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{border:0;background:none;font-size:22px;color:var(--ink);padding:4px}.progress{height:5px;background:#e8ecee;border-radius:10px;flex:1;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal);border-radius:10px;transition:.25s}.count{font-size:12px;color:var(--muted);white-space:nowrap}
.center{text-align:center}.logoicon{font-size:58px;margin-top:25px}.logo{font-size:43px;font-weight:800;letter-spacing:-2px;color:var(--teal);margin:6px 0}.logo b{color:var(--ink)}h1{font-size:28px;line-height:1.12;margin:12px 0}h2{font-size:25px;line-height:1.2;text-align:center;margin:8px 0 10px}p{line-height:1.45;color:var(--muted);margin:8px 0}.hero{margin:22px 0 10px;font-size:74px}
.spacer{flex:1;min-height:18px}.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:var(--soft);color:var(--ink)}.link{background:none;color:var(--teal);font-weight:650;border:0;margin-top:10px;padding:10px;cursor:pointer}
.card{border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff;text-align:left}.card.selected{border-color:#73b879;background:#f2faf3}.card .emoji{font-size:23px}.card .check{margin-left:auto;color:var(--green);font-size:20px}.card strong{display:block;font-size:15px}.hint{background:var(--soft);padding:14px;border-radius:14px;font-size:13px;margin-top:14px}
.checkrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;cursor:pointer}.checkrow.sel{background:#eef9f9;border-color:#77bfc1}.box{width:20px;height:20px;border:1.5px solid #aab3b8;border-radius:5px;display:grid;place-items:center;flex:none}.sel .box{background:var(--teal);border-color:var(--teal);color:#fff}.scroll{overflow:auto;max-height:55vh}
.location{background:linear-gradient(145deg,#f2fbfb,#fff);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin-top:16px}.pin{font-size:40px}
.loading{text-align:center}.compass{font-size:90px;margin:50px 0 15px}.spin{display:inline-block;animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rec{border-radius:16px;padding:16px;margin:10px 0;border:1px solid var(--line);cursor:pointer}.rec:nth-of-type(1){background:#fff5f5}.rec:nth-of-type(2){background:#fff9f0}.rec:nth-of-type(3){background:#fffdf0}.rec:nth-of-type(4){background:#f2fbf2}.rec h3{margin:0 0 6px;font-size:16px}.rec p{font-size:13px;margin:0}.nav{position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px 8px calc(11px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted)}.nav b{color:var(--teal)}.detail .icon{font-size:38px}.detail h1{text-align:left}.detail .info{background:var(--soft);padding:15px;border-radius:14px;margin-top:18px}.notice{font-size:12px;color:var(--muted);margin-top:20px}
.reason{font-size:12px;color:#0f777b;margin-top:9px;font-weight:600}.tag{display:inline-block;font-size:11px;background:#e9f6f6;color:#0f777b;border-radius:12px;padding:4px 9px;margin-bottom:8px}.rec{background:#fff!important;cursor:pointer}.rec:focus-visible{outline:3px solid var(--teal)}.rec h3{line-height:1.4}.info p{line-height:1.55}.smallnote{font-size:12px;color:var(--muted)}
.guide-section{margin:17px 0}.guide-section h3{font-size:17px;margin:0 0 9px}.guide-step{display:flex;align-items:flex-start;gap:11px;padding:13px 10px;border:1px solid var(--line);border-radius:12px;margin:9px 0;cursor:pointer;line-height:1.45}.guide-step input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin:1px}.guide-step.done{background:#f0f9f6}.guide-step.done span{text-decoration:line-through;color:var(--muted)}.guide-source{display:block;padding:9px 0;color:var(--teal);overflow-wrap:anywhere}.guide-warning{background:#fff7e9;padding:13px;border-radius:12px;font-size:13px;line-height:1.5}.guide-meter{height:7px;background:#e5e9ec;border-radius:12px;overflow:hidden}.guide-meter span{display:block;height:100%;background:var(--teal)}.guide-small{font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const S={step:0,stage:"",age:"",location:"",diagnosis:"",needs:[],interventions:[],school:"",notifications:false};
const teal="#168f93";
const app=document.getElementById("app");
function header(){if(S.step===0||S.step>=10)return "";return `<div class="top"><button class="back" onclick="back()">‹</button><div class="progress"><span style="width:${Math.min(100,S.step/8*100)}%"></span></div><div class="count">${Math.min(S.step,8)} de 8</div></div>`}
function shell(body){app.innerHTML=`<main>${header()}${body}</main>`}
function btn(t,fn="next()"){return `<button class="btn primary" onclick="${fn}">${t}</button>`}
function option(emoji,text,key,selected){return `<button type="button" class="card ${selected===text?"selected":""}" onclick="choose('${key}','${encodeURIComponent(text)}')"><span class="emoji">${emoji}</span><strong>${text}</strong>${selected===text?'<span class="check">✓</span>':''}</button>`}
function welcome(){shell(`<div class="center"><div class="spacer"></div><div class="logoicon">🧭</div><div class="logo">TE<span>guí</span><b>A</b></div><p style="font-size:17px;color:#24303a">Tu guía para resolver tus dudas sobre el Autismo</p><div class="hero">👨‍👩‍👧</div><h1>No tienes que saber por dónde empezar.</h1><p>TEguíA te ayudará a entender el TEA, encontrar recursos y descubrir qué pasos puedes dar según vuestra situación.</p><div class="spacer"></div>${btn("Empezar","S.step=1;render()")}<button class="link">Primera versión de prueba</button></div>`)}
function single(title,sub,opts,key){shell(`<h2>${title}</h2><p class="center">${sub}</p><div>${opts.map(o=>option(o[0],o[1],key,S[key])).join("")}</div><div class="spacer"></div>${btn("Continuar")}`)}
function multi(title,sub,opts,key){shell(`<h2>${title}</h2><p class="center">${sub}</p><div class="scroll">${opts.map(o=>{let on=S[key].includes(o);return `<button type="button" class="checkrow ${on?"sel":""}" onclick="toggle('${key}','${encodeURIComponent(o)}')"><span class="box">${on?"✓":""}</span><span>${o}</span></button>`}).join("")}</div><div class="spacer"></div>${btn("Continuar")}`)}
function render(){
 if(S.step===0)return welcome();
 if(S.step===1)return single("¿En qué momento estáis ahora mismo?","No hay una respuesta correcta. Elige la que mejor describa vuestra situación.",[["🔎","Tengo algunas preocupaciones sobre el desarrollo de mi hijo/a"],["🩺","Estamos buscando una valoración"],["🧩","Ya tenemos un diagnóstico de TEA"],["🧭","Ya llevamos tiempo con el diagnóstico y necesitamos orientación"]],"stage");
 if(S.step===2)return single("¿Qué edad tiene tu hijo/a?","La edad nos ayuda a mostrarte información y recursos más relevantes.",[["👶","0–2 años"],["🧒","3–5 años"],["🧑","6–11 años"],["🧑‍🎓","12–17 años"]],"age");
 if(S.step===3)return shell(`<h2>¿Dónde vivís?</h2><p class="center">En esta versión solo guardaremos una zona orientativa durante esta sesión. Todavía no hay búsqueda de centros por ubicación.</p><div class="location"><div class="pin">📍</div><b>Tu ubicación es importante</b><p>En esta versión puedes usar una ubicación aproximada o indicar una zona manualmente.</p></div>${btn("📍 Continuar sin indicar zona","S.location='Sin especificar';S.step=4;render()")}${btn("Usar Cataluña como zona de ejemplo","S.location='Cataluña';S.step=4;render()")}<div class="hint">🔒 Tu privacidad es importante. Este prototipo no envía tu ubicación a ningún servicio externo.</div><div class="spacer"></div>`);
 if(S.step===4)return single("¿Tenéis un diagnóstico de TEA?","Esta respuesta cambia el tipo de orientación que te mostraremos.",[["🌱","No, todavía no tenemos diagnóstico"],["🧩","Sí, tenemos un diagnóstico de TEA"]],"diagnosis");
 if(S.step===5)return multi("¿Qué necesitas ahora mismo?","Puedes elegir varias opciones. Si no sabes por dónde empezar, también puedes decírnoslo.",["🧠 Entender mejor el TEA","🧩 Conocer las intervenciones y terapias","📍 Encontrar profesionales o centros","💶 Conocer ayudas y trámites","🏫 Información sobre educación","❤️ Orientación para el día a día","📋 Organizar los próximos pasos","🧭 No sé por dónde empezar"],"needs");
 if(S.step===6)return multi("¿Habéis empezado alguna intervención?","Puedes elegir varias opciones.",["Ninguna todavía","Psicología","Logopedia","Terapia ocupacional","Atención temprana","Otra","No estoy seguro/a"],"interventions");
 if(S.step===7)return single("¿Tu hijo/a está escolarizado/a actualmente?","Esto nos ayudará a preparar mejor la parte educativa.",[["🏫","Sí"],["🏠","No"],["🌱","Todavía no"]],"school");
 if(S.step===8)return shell(`<h2>¿Te interesarían recordatorios en el futuro?</h2><p class="center">Algunas ayudas, terapias, recursos y decisiones educativas pueden necesitar revisarse a medida que tu hijo crece.</p><div class="checkrow ${S.notifications?"sel":""}" onclick="S.notifications=!S.notifications;render()"><span class="box">${S.notifications?"✓":""}</span><span>🔔 Sí, me interesarían (aún no se envían avisos)</span></div><div class="spacer"></div>${btn("Continuar","S.step=9;render()")}`);
 if(S.step===9)return shell(`<div class="loading center"><div class="compass">🧭</div><h1>Estamos preparando vuestro camino…</h1><p>Hemos tenido en cuenta las respuestas de este cuestionario para ordenar recomendaciones orientativas.</p><p class="spin" style="font-size:28px">◌</p><div class="spacer"></div>${btn("Ver mi camino","openPersonalizedPath()")}</div>`);
 if(S.step===10)return path();
 if(S.step===12)return concernGuide();
 if(S.step===11)return detail(S.detail||"intervenciones");
}
function openPersonalizedPath(){S.concernIndex=0;S.step=S.stage==="Tengo algunas preocupaciones sobre el desarrollo de mi hijo/a"?12:10;render()}
function next(){const required={1:"stage",2:"age",4:"diagnosis",7:"school"};if(required[S.step]&&!S[required[S.step]]){alert("Selecciona una opción para continuar.");return}if(S.step<9){S.step++;render()}else{S.step=10;render()}}
function back(){if(S.step>1){S.step--;render()}else if(S.step===1){S.step=0;render()}}
function choose(k,v){S[k]=decodeURIComponent(v);render()}
function toggle(k,v){v=decodeURIComponent(v);let i=S[k].indexOf(v);if(i>=0)S[k].splice(i,1);else S[k].push(v);render()}

const concernScreens=[["❤️","Respira. No tienes que resolverlo todo hoy.","Si algo en el desarrollo de tu hijo o hija te preocupa, es normal tener muchas preguntas. Algunas características pueden aparecer en el TEA, pero ninguna señal aislada confirma un diagnóstico. Hablarlo con un profesional es un buen primer paso."],["👀","Lo que estás observando importa.","Algunas señales que merece la pena comentar son diferencias en la comunicación, la respuesta al nombre, la atención compartida, el juego, las reacciones sensoriales o la adaptación a cambios. Cada niño tiene su propio desarrollo y estas señales no bastan para diagnosticar TEA."],["🔄","¿Ha perdido habilidades que ya tenía?","Si antes utilizaba palabras, respondía a su nombre o mostraba habilidades que ahora han desaparecido, solicita una valoración médica sin esperar. La pérdida de habilidades no significa necesariamente autismo y puede tener distintas causas."],["🧩","¿Significa que tiene autismo?","No necesariamente. TEguíA no diagnostica. El diagnóstico requiere una valoración clínica del desarrollo por profesionales con experiencia. Esta guía te ayuda a organizar las preguntas y los próximos pasos."],["🩺","Prepara la primera consulta","Anota qué has observado, desde cuándo sucede y si has notado cambios. Si tienes vídeos cotidianos que ilustren tus dudas, puedes enseñarlos al profesional. Consulta con pediatría y pregunta por una evaluación del desarrollo y los recursos de atención temprana."],["🧠","Infórmate mientras esperas","Puedes conocer las opciones de apoyo y atención temprana mientras se realiza la valoración. No es necesario esperar a una etiqueta diagnóstica para consultar dificultades del desarrollo. Las intervenciones deben adaptarse a las necesidades individuales y contar con orientación profesional."],["❤️","No tienes que hacerlo todo hoy","Es comprensible sentirse perdido o tener muchas dudas. Pedir orientación y avanzar paso a paso es suficiente para empezar. Ahora te mostraremos vuestro camino con los próximos recursos y cuestiones que conviene revisar."]];
function concernGuide(){const x=concernScreens[S.concernIndex||0];shell(`<div style="text-align:center;font-size:44px;margin-top:12px">${x[0]}</div><h1 style="text-align:center">${x[1]}</h1><p style="font-size:17px;color:#24303a;line-height:1.65;margin-top:20px">${x[2]}</p><div class="spacer"></div><p class="notice">Paso ${(S.concernIndex||0)+1} de 7 · Información general, no sustituye la valoración profesional.</p>${btn((S.concernIndex||0)===6?"🧭 Continuar con mi camino":"Continuar →","nextConcern()")}<button class="link" onclick="S.concernIndex>0?(S.concernIndex--,render()):(S.step=9,render())">← Volver</button></div>`)}
function nextConcern(){if((S.concernIndex||0)<6){S.concernIndex++;render()}else{S.step=10;render()}}

const RULES=[
{id:"valoracion",icon:"🩺",title:"Solicitar una valoración del desarrollo",description:"Prepara tus observaciones y coméntalas con pediatría. Pregunta por los recursos de evaluación y atención temprana disponibles.",topics:"Pediatría · Desarrollo · Evaluación",action:"Anota ejemplos concretos, desde cuándo ocurren y las preguntas que quieres hacer en consulta.",base:0,when:x=>!x.hasDiagnosis&&(x.concern||x.assessment),points:x=>x.concern?100:95,why:x=>x.concern?"Has indicado que tienes preocupaciones sobre el desarrollo.": "Habéis indicado que estáis buscando una valoración."},
{id:"temprana",icon:"🌱",title:"Informarte sobre atención temprana",description:"Conoce qué apoyos del desarrollo pueden valorarse en edades tempranas y cómo consultar los servicios disponibles.",topics:"Atención temprana · Recursos por edad",action:"Pregunta a pediatría por los circuitos de atención temprana de tu comunidad autónoma.",base:0,when:x=>x.young&&(x.concern||x.assessment||x.hasDiagnosis),points:x=>x.young?88:0,why:x=>"La edad indicada es de 0 a 5 años, una etapa en la que conviene conocer estos recursos."},
{id:"intervenciones",icon:"🧩",title:"Conocer las opciones de intervención",description:"Infórmate sobre los apoyos individualizados y las funciones de los distintos profesionales, sin asumir que todas las terapias son necesarias.",topics:"Logopedia · Psicología · Terapia ocupacional · Apoyos",action:"Identifica las necesidades cotidianas y consulta con profesionales cualificados qué apoyos tienen sentido para vuestro caso.",base:35,when:x=>x.hasDiagnosis||x.needs.some(n=>n.includes("intervenciones"))||x.interventions.length>0,points:x=>x.hasDiagnosis?72:40,why:x=>x.hasDiagnosis?"Habéis indicado que existe un diagnóstico.":"Habéis mostrado interés por conocer intervenciones o ya habéis iniciado algún apoyo."},
{id:"recursos",icon:"📍",title:"Explorar recursos y profesionales",description:"Conoce qué tipos de servicios existen. El directorio de centros verificados todavía está en desarrollo.",topics:"Centros · Profesionales · Servicios públicos",action:"Consulta con los servicios públicos de tu zona y solicita información sobre especialidades, derivaciones y listas de espera.",base:25,when:x=>true,points:x=>x.needs.some(n=>n.includes("profesionales")||n.includes("centros"))?78:25,why:x=>x.needs.some(n=>n.includes("profesionales")||n.includes("centros"))?"Has seleccionado que necesitas encontrar profesionales o centros.":"Conocer los recursos disponibles puede ayudarte a planificar los siguientes pasos."},
{id:"ayudas",icon:"💶",title:"Informarte sobre ayudas y trámites",description:"Revisa qué procedimientos podrían corresponder a vuestra situación. La elegibilidad depende de cada administración y de los requisitos aplicables.",topics:"Discapacidad · Dependencia · Prestaciones",action:"Consulta las fuentes oficiales de tu comunidad autónoma antes de iniciar solicitudes; prepara preguntas sobre requisitos y documentación.",base:10,when:x=>x.hasDiagnosis||x.needs.some(n=>n.includes("ayudas")),points:x=>x.needs.some(n=>n.includes("ayudas"))?85:48,why:x=>x.needs.some(n=>n.includes("ayudas"))?"Has indicado que necesitas información sobre ayudas y trámites.":"Tras un diagnóstico puede ser útil informarse sobre los trámites disponibles, sin presuponer el derecho a una prestación."},
{id:"educacion",icon:"🏫",title:"Revisar apoyos educativos",description:"Infórmate sobre la coordinación con el centro educativo y los apoyos que pueden valorarse según las necesidades.",topics:"Escuela · Orientación · Apoyos",action:"Si está escolarizado, solicita una reunión con el centro para comentar necesidades y apoyos. Si no, infórmate sobre el proceso de escolarización.",base:15,when:x=>x.school==="Sí"||x.needs.some(n=>n.includes("educación"))||x.school==="Todavía no",points:x=>x.needs.some(n=>n.includes("educación"))?83:x.school==="Sí"?52:28,why:x=>x.needs.some(n=>n.includes("educación"))?"Has pedido información sobre educación.":x.school==="Sí"?"Has indicado que tu hijo o hija está escolarizado.":"Habéis indicado que la escolarización está pendiente."},
{id:"diaadia",icon:"❤️",title:"Orientación para el día a día",description:"Busca estrategias adaptadas a la comunicación, el bienestar y la participación en las rutinas familiares.",topics:"Comunicación · Rutinas · Bienestar familiar",action:"Elige una situación cotidiana que os resulte difícil y anota qué sucede antes, durante y después para comentarlo con un profesional.",base:15,when:x=>x.hasDiagnosis||x.needs.some(n=>n.includes("día a día")),points:x=>x.needs.some(n=>n.includes("día a día"))?86:35,why:x=>x.needs.some(n=>n.includes("día a día"))?"Has pedido orientación para el día a día.":"Las necesidades de apoyo también pueden aparecer en las rutinas cotidianas."},
{id:"entender",icon:"🧠",title:"Comprender el desarrollo y el TEA",description:"Lee información general y fiable sobre el desarrollo infantil y el autismo sin convertir las señales en un autodiagnóstico.",topics:"Desarrollo · Señales · TEA",action:"Escribe las dudas principales que te gustaría resolver con el profesional que acompaña a tu familia.",base:22,when:x=>!x.hasDiagnosis||x.needs.some(n=>n.includes("Entender")),points:x=>x.needs.some(n=>n.includes("Entender"))?76:x.concern?65:25,why:x=>x.needs.some(n=>n.includes("Entender"))?"Has seleccionado que quieres entender mejor el TEA.":"La información general puede ayudar a organizar preguntas durante el proceso de valoración."},
{id:"organizar",icon:"📋",title:"Organizar los próximos pasos",description:"Reúne preguntas y tareas en una lista sencilla para ir avanzando a vuestro ritmo.",topics:"Preguntas · Prioridades · Seguimiento",action:"Apunta un próximo paso concreto y una pregunta para la siguiente visita profesional.",base:12,when:x=>true,points:x=>x.needs.some(n=>n.includes("Organizar")||n.includes("No sé"))?70:12,why:x=>x.needs.some(n=>n.includes("Organizar")||n.includes("No sé"))?"Has indicado que necesitas organizarte o no sabes por dónde empezar.":"Una lista breve puede ayudar a ordenar la información."}
];
function getContext(){const hasDiagnosis=S.diagnosis.startsWith("Sí")||S.stage.startsWith("Ya tenemos")||S.stage.startsWith("Ya llevamos");return {hasDiagnosis,concern:S.stage.startsWith("Tengo algunas"),assessment:S.stage.startsWith("Estamos buscando"),young:S.age==="0–2 años"||S.age==="3–5 años",school:S.school,needs:S.needs||[],interventions:(S.interventions||[]).filter(v=>!["Ninguna todavía","No estoy seguro/a"].includes(v))}}
function recommendations(){const x=getContext();return RULES.filter(r=>r.when(x)).map(r=>({...r,score:r.points(x),reason:r.why(x)})).sort((a,b)=>b.score-a.score||RULES.indexOf(a)-RULES.indexOf(b))}
function path(){
 const recs=recommendations();if(getContext().hasDiagnosis&&!recs.some(r=>r.id==="diagnostico"))recs.unshift({id:"diagnostico",icon:"🧭",title:"Acabamos de recibir el diagnóstico: ¿y ahora qué?",description:"Primeros pasos tras recibir un diagnóstico de TEA.",reason:"Habéis indicado que tenéis un diagnóstico de TEA."});S.recs=recs;
 shell(`<div class="path"><div style="font-size:28px">🧭</div><h1>Vuestro camino</h1><p>Estas recomendaciones están ordenadas según lo que nos has contado. No tienes que hacerlo todo hoy.</p><div class="hint">🧠 Personalización por reglas: etapa, edad, diagnóstico, necesidades y escolarización. Las recomendaciones son orientativas y no constituyen una evaluación clínica.</div>${recs.slice(0,5).map((r,i)=>`<button type="button" class="rec" style="display:block;width:100%;text-align:left" onclick="S.detail='${r.id}';S.step=11;render()"><span class="tag">${i===0?"Para empezar":"Recomendación "+(i+1)}</span><h3>${r.icon} ${r.title} <span style="float:right">›</span></h3><p>${r.description}</p><div class="reason">Por qué aparece: ${r.reason}</div></button>`).join("")}${recs.length>5?`<button class="btn secondary" onclick="S.showAll=!S.showAll;render()">${S.showAll?"Ocultar recomendaciones adicionales":"Ver "+(recs.length-5)+" recomendaciones más"}</button>`:""}${S.showAll?recs.slice(5).map(r=>`<button type="button" class="rec" style="display:block;width:100%;text-align:left" onclick="S.detail='${r.id}';S.step=11;render()"><h3>${r.icon} ${r.title} ›</h3><p>${r.description}</p><div class="reason">Por qué aparece: ${r.reason}</div></button>`).join(""):""}<p class="notice">TEguíA no diagnostica ni sustituye el criterio profesional. El orden no representa una urgencia clínica. La información no se envía a un servidor en este prototipo.</p>${btn("Revisar mis respuestas","S.step=1;render()")}</div>`);
}

const GUIDES={
valoracion:{heading:"Me preocupa su desarrollo: ¿qué hago ahora?",intro:"Observar diferencias en el desarrollo puede generar dudas. Esta guía te ayuda a preparar una consulta y conocer los primeros pasos, sin sacar conclusiones diagnósticas.",sections:[["Qué puedes hacer hoy","Anota ejemplos concretos de comunicación, juego, interacción, movimientos o conductas que te preocupen. Indica cuándo empezaron y en qué situaciones aparecen."],["A quién acudir","Solicita cita con pediatría o con el profesional sanitario que siga el desarrollo de tu hijo o hija. Pregunta si conviene una valoración del desarrollo y cómo acceder a los servicios de atención temprana de tu zona."],["Mientras esperáis","Puedes pedir orientación sobre comunicación, juego y apoyos cotidianos adaptados a sus necesidades. No hace falta esperar a tener un diagnóstico para consultar dificultades del desarrollo."]],warning:"Si ha perdido habilidades que ya tenía, como palabras o capacidades motoras, solicita una valoración médica sin demora. Ante síntomas agudos o graves, utiliza los servicios sanitarios urgentes.",tasks:["Anotar qué he observado y desde cuándo","Preparar ejemplos y preguntas para la consulta","Pedir cita con pediatría","Preguntar por evaluación del desarrollo y atención temprana"],sources:[["Canal Salut — Generalitat de Catalunya","https://canalsalut.gencat.cat/"],["CDC — Actúa pronto ante preocupaciones del desarrollo (español)","https://www.cdc.gov/act-early/es/"]]},
intervenciones:{heading:"Intervenciones y apoyos: cómo orientarse",intro:"No existe una única intervención adecuada para todas las personas autistas. Lo importante es partir de las necesidades, fortalezas, preferencias y objetivos de cada niño o niña.",sections:[["Identificar necesidades","Piensa qué situaciones necesitan más apoyo: comunicación, participación en la escuela, autonomía, regulación, sueño o actividades cotidianas."],["Conocer profesionales","Según la valoración, pueden participar profesionales de logopedia, psicología, terapia ocupacional, educación y otros ámbitos. No todos los apoyos son necesarios para todas las familias."],["Cómo valorar una propuesta","Pide objetivos concretos, evidencia disponible, forma de medir avances, participación familiar, cualificación profesional y revisión periódica. Desconfía de promesas de curación o resultados garantizados."]],warning:"Evita iniciar o suspender tratamientos sanitarios por información de una web. Consulta con profesionales cualificados; el autismo no es una enfermedad que deba curarse.",tasks:["Anotar necesidades y fortalezas prioritarias","Pedir objetivos y explicación de la intervención propuesta","Preguntar cómo se evalúan los avances","Revisar periódicamente si los apoyos siguen siendo útiles"],sources:[["NICE — Autism spectrum disorder in under 19s: support and management (inglés)","https://www.nice.org.uk/guidance/cg170"],["Canal Salut — Generalitat de Catalunya","https://canalsalut.gencat.cat/"]]},
organizar:{heading:"Organizar los próximos pasos",intro:"No hace falta resolverlo todo a la vez. Una lista corta puede ayudaros a decidir qué hacer primero y qué preguntar en cada visita.",sections:[["Elegir una prioridad","Escoge una cuestión importante para vuestra familia esta semana, por ejemplo una consulta, una reunión escolar o una necesidad cotidiana."],["Preparar la información","Reúne informes que ya tengas, observaciones, preguntas y datos de contacto. No necesitas compartir documentación sanitaria con TEguíA."],["Revisar y adaptar","Cuando completes un paso, decide cuál será el siguiente. El ritmo puede cambiar según vuestra situación."]],warning:"Esta lista es una ayuda organizativa; no sustituye el seguimiento sanitario, educativo o social.",tasks:["Elegir una prioridad para esta semana","Escribir tres preguntas importantes","Preparar los documentos que ya tengo","Revisar el siguiente paso después de la consulta"],sources:[["Canal Salut — Generalitat de Catalunya","https://canalsalut.gencat.cat/"]]}
};
const DIAG_GUIDE={heading:"Acabamos de recibir el diagnóstico: ¿y ahora qué?",intro:"Recibir un diagnóstico puede despertar emociones muy diferentes. No es necesario tomar todas las decisiones de inmediato. Podéis avanzar según las necesidades y el ritmo de vuestra familia.",sections:[["Entender el informe","Pide que te expliquen las conclusiones, las fortalezas observadas, las necesidades de apoyo y qué seguimiento se propone. Anota las dudas que queden."],["Priorizar apoyos","Pregunta por recursos públicos y profesionales de referencia. Los apoyos deben adaptarse a la persona y a su contexto, no únicamente a una etiqueta diagnóstica."],["Informarte sobre escuela y trámites","Si corresponde, habla con el centro educativo y consulta con los servicios sociales o la administración competente sobre posibles procedimientos y requisitos. Un diagnóstico no concede automáticamente una prestación."]],warning:"No existe una carrera para empezar todas las terapias. Desconfía de tratamientos que prometan curar el autismo.",tasks:["Revisar el informe con el profesional","Anotar las principales necesidades y fortalezas","Preguntar por los recursos públicos disponibles","Consultar los apoyos educativos o trámites pertinentes"],sources:[["Canal Salut — Generalitat de Catalunya","https://canalsalut.gencat.cat/"],["Tràmits — Generalitat de Catalunya","https://tramits.gencat.cat/"]]};
function safeText(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function taskKey(id){return "teguia04:"+id}
function readTasks(id,n){try{let a=JSON.parse(localStorage.getItem(taskKey(id))||"[]");return Array.from({length:n},(_,i)=>a[i]===true)}catch(e){return Array(n).fill(false)}}
function markTask(id,i,checked){const g=id==="diagnostico"?DIAG_GUIDE:GUIDES[id];if(!g)return;let a=readTasks(id,g.tasks.length);a[i]=checked;try{localStorage.setItem(taskKey(id),JSON.stringify(a))}catch(e){}render()}
function guideView(id,g,reason){const checks=readTasks(id,g.tasks.length),done=checks.filter(Boolean).length;
shell(`<div class="detail"><button class="link" onclick="S.step=10;render()">← Vuestro camino</button><div class="tag">Guía práctica · TEguíA 0.4</div><h1>${safeText(g.heading)}</h1><p>${safeText(g.intro)}</p>${reason?`<div class="hint"><b>Por qué aparece en vuestro camino</b><p>${safeText(reason)}</p></div>`:""}${g.sections.map(([heading,body])=>`<section class="guide-section"><h3>${safeText(heading)}</h3><p>${safeText(body)}</p></section>`).join("")}<div class="guide-warning">⚠️ ${safeText(g.warning)}</div><section class="guide-section"><h3>📋 Vuestros próximos pasos</h3><p class="guide-small">Marca lo que ya hayas hecho. Se guarda solo en este navegador y dispositivo.</p><div class="guide-meter"><span style="width:${100*done/checks.length}%"></span></div><p class="guide-small">${done} de ${checks.length} pasos completados</p>${g.tasks.map((task,i)=>`<label class="guide-step ${checks[i]?"done":""}"><input type="checkbox" ${checks[i]?"checked":""} onchange="markTask('${id}',${i},this.checked)"><span>${safeText(task)}</span></label>`).join("")}</section><section class="guide-section"><h3>🔗 Fuentes para ampliar información</h3>${g.sources.map(([label,url])=>`<a class="guide-source" href="${url}" target="_blank" rel="noopener noreferrer">${safeText(label)} ↗</a>`).join("")}<p class="guide-small">Enlaces institucionales y de orientación general; la información y los procedimientos pueden variar por territorio. Consulta siempre las versiones vigentes.</p></section><p class="notice">Información general, no diagnóstico ni consejo clínico individual. TEguíA no envía tus respuestas ni las tareas a un servidor. Si borras los datos del navegador, se perderán las marcas.</p>${btn("← Volver a mi camino","S.step=10;render()")}</div>`)}
function detail(type){
 const r=recommendations().find(x=>x.id===type);
 if(type==="diagnostico")return guideView("diagnostico",DIAG_GUIDE,"Habéis indicado que tenéis un diagnóstico de TEA.");
 if(!r){S.step=10;return path()}
 if(type==="valoracion"&&getContext().hasDiagnosis)return guideView("diagnostico",DIAG_GUIDE,r.reason);
 if(GUIDES[type])return guideView(type,GUIDES[type],r.reason);
 shell(`<div class="detail"><div class="icon">${r.icon}</div><h1>${r.title}</h1><p style="font-size:17px">${r.description}</p><div class="info"><b>Por qué te recomendamos esto</b><p>${r.reason}</p></div><div class="info"><b>Primer paso que puedes dar</b><p>${r.action}</p></div><div class="info"><b>Temas relacionados</b><p>${r.topics}</p></div><p class="notice">Orientación general, no diagnóstico ni indicación individualizada. En futuras versiones añadiremos fuentes oficiales y recursos contrastados.</p><div class="spacer"></div>${btn("← Volver a mi camino","S.step=10;render()")}</div>`);
}

render();
</script>
